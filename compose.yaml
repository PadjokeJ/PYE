services:
  pye:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:alpine
    restart: always
    hostname: postgres
    ports:
      - "5432:5432"
    environment: 
      POSTGRES_PASSWORD: ${PSQL_PW}
      POSTGRES_USER: psql
      POSTGRES_DB: pyedb
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psql -d pyedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database:
