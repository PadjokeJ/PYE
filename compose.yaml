services:
  pye:
    build: "https://github.com/PadjokeJ/PYE.git"
    restart: unless-stopped
    hostname: pye
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PW: ${ADMIN_PW}
      SERVICE_EMAIL: ${SERVICE_EMAIL}
      SERVICE_EMAIL_PASSWORD: ${SERVICE_EMAIL_PASSWORD}
      SERVICE_SERVER: ${SERVICE_SERVER}
      SERVICE_PORT: ${SERVICE_PORT}
      PSQL_HOSTNAME: ${PSQL_HOSTNAME}
      PSQL_PW: ${PSQL_PW}
      SECRET: ${SECRET}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health/"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:alpine
    restart: unless-stopped
    hostname: postgres
    ports:
      - "5432:5432"
    environment: 
      POSTGRES_PASSWORD: ${PSQL_PW}
      POSTGRES_USER: psql
      POSTGRES_DB: pyedb
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psql -d pyedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database:
