{% extends 'base.html' %}

{% block title %}Console d'administrateur{% endblock %}
{% block ogtitle %}Console d'administrateur{% endblock %}

{% block admactive %}active{% endblock %}

{% block content %}
<div style="display: flex;flex-direction: column;align-items: center; width:100%;">
<a style="margin: 20px; box-shadow: var(--shadow) 2px 2px 10px; padding: 10px; border-radius: 15px;" href="/users">Modifier les utilisateurs</a>
<div class="island">
  <form id="form" action="/add-user" method="post">
    <label for="name">Prénom<span style="color: #ff0000">*</span></label>
    <input type="text" name="name" required></input>

    <label for="surname">Nom<span style="color: #ff0000">*</span></label>
    <input type="text" name="surname" required></input>

    <label for="type">Type<span style="color: #ff0000">*</span></label>
    <select name="type" id="user_type" required>
      <option value="Student">Étudiant</option>
      <option value="Parent">Parent</option>
      <option value="Teacher">Prof</option>
      <option value="Direction">Direction</option>
      <option value="Admin">Admin</option>
    </select>

    <div id="student_id_div" style="display:none;">
      <label for="student_id">Child</label>
      <select name="student_id" id="student_id">
        {% for student in students %}
        <option value="{{ student.id }}">{{ student.user.name }} {{ student.user.firstname }}</option>
        {% endfor %}
      </select>
    </div>

    <label for="email">Email<span style="color: #ff0000">*</span></label>
    <input type="email" name="email" required></input>

    <label for="surname">Mot de passe<span style="color: #ff0000">*</span></label>
    <input type="text" name="password" id="pw" required></input>
    <a class="button" href="#" onclick="function hexS() { return Math.floor((Math.random() * 0.9 + 0.1) * 4294967295).toString(16); };function gen(){ document.getElementById('pw').value = hexS() + '-' + hexS() }; gen();">Générer</a>
    <input id="submit" type="submit" name="submit" value="Ajouter l'utilisateur">
  </form>
</div>
<script>
  document.getElementById("user_type").addEventListener("input", () => {
    if (document.getElementById("user_type").value == "Parent") {
      document.getElementById("student_id_div").style.display = "block";
    } else {

      document.getElementById("student_id_div").style.display = "none";
    }
  })
</script>
<div>
{% endblock %}
