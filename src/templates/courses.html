{% extends 'base.html' %}

{% block title %}Courses{% endblock %}
{% block ogtitle %}Courses{% endblock %}

{% block cactive %}active{% endblock %}

{% block content %}

  <ul>
  {% for c in courses %}

  {% endfor %}
  </ul>
{% endblock %}
